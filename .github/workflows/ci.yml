name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 工具链版本钉死：cli.moonbitlang.com 不提供历史版本下载（带版本的路径 403），
  # 用 actions/cache 把安装结果钉在这个常量上实现可复现。
  # 升级流程 = bump 此常量 → 本地全量验证（check/test/fmt/info + smoke）→ 同步提交。
  # 本仓库曾因 latest 漂移挂掉：v0.10.12 改名了 strconv.from_str。
  MOONBIT_VERSION: 0.1.20260904

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore MoonBit toolchain (pinned by MOONBIT_VERSION)
        id: moon-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}

      - name: Install MoonBit (cache miss only)
        if: steps.moon-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # latest 会漂移：安装/缓存结果与钉住版本不符时立即失败，逼出显式升级
      - name: Verify pinned toolchain version
        run: |
          moon version --all
          moon version | grep -F "${{ env.MOONBIT_VERSION }}"

      - name: Fetch dependencies
        run: |
          moon update
          moon install

      - name: Lint (check --deny-warn)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      # pkg.generated.mbti 进版本控制，接口漂移（改了代码没跑 moon info）直接挂
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Test
        run: moon test

      - name: Release build & smoke test
        run: |
          moon build --release
          _build/native/release/build/cmd/main/main.exe help > /dev/null

      # 真实二进制全链路：add/query/remove/import/init（shell 矩阵未装的自动跳过）
      - name: End-to-end smoke (scripts/smoke.sh)
        run: bash scripts/smoke.sh

      # 扩展面 golden 冻结（out/err/code 三元组逐字节）：上游无裁判可用，
      # 人工核验后的 golden 即裁判；runner 自带 python3，release 二进制已构建
      - name: Golden check (scripts/golden_check.sh)
        run: bash scripts/golden_check.sh
