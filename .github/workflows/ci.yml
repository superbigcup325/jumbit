name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 工具链版本钉死（本仓库版本口径的唯一权威，README「安装」节与其呼应）。
  # 升级流程：
  #   1. 本地装 latest：curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
  #      （版本化直链亦可：binaries/<版本>/moonbit-linux-x86_64.tar.gz，
  #       cores/<版本>.tar.gz；target 格式为 linux-x86_64）
  #   2. moon version 取新版本号 bump 此常量
  #   3. 全套闸门本地全绿：regression/golden/dataset/chaos/realdata
  #   4. 同步提交推送，盯 CI（本仓库曾因 latest 漂移挂掉：v0.10.12 改名了 strconv.from_str）
  MOONBIT_VERSION: 0.1.20260920

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore MoonBit toolchain (pinned by MOONBIT_VERSION)
        id: moon-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: moonbit-${{ env.MOONBIT_VERSION }}

      - name: Install MoonBit (cache miss only)
        if: steps.moon-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # latest 会漂移：安装/缓存结果与钉住版本不符时立即失败，逼出显式升级
      - name: Verify pinned toolchain version
        run: |
          moon version --all
          moon version | grep -F "${{ env.MOONBIT_VERSION }}"

      - name: Fetch dependencies
        run: |
          moon update
          moon install

      - name: Lint (check --deny-warn)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      # pkg.generated.mbti 进版本控制，接口漂移（改了代码没跑 moon info）直接挂
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Test
        run: moon test

      - name: Release build & smoke test
        run: |
          moon build --release
          _build/native/release/build/cmd/main/main.exe help > /dev/null

      # 真实二进制全链路：add/query/remove/import/init（shell 矩阵未装的自动跳过）
      - name: End-to-end smoke (scripts/smoke.sh)
        run: bash scripts/smoke.sh

      # 扩展面 golden 冻结（out/err/code 三元组逐字节）：上游无裁判可用，
      # 人工核验后的 golden 即裁判；runner 自带 python3，release 二进制已构建
      - name: Golden check (scripts/golden_check.sh)
        run: bash scripts/golden_check.sh

      # MCP 协议面冻结：stdio 会话固定消息序列逐字节比对（信封/工具目录/
      # 错误码），protocol 层的字节确定性不靠肉眼
      - name: MCP protocol check (scripts/mcp_check.sh)
        run: bash scripts/mcp_check.sh
