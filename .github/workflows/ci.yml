name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Toolchain version pin: the single source of truth for the version this repo
  # targets (the README's Install section mirrors it).
  # Upgrade procedure:
  #   1. Install latest locally:
  #      curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
  #      (versioned direct links work too:
  #       binaries/<version>/moonbit-linux-x86_64.tar.gz and
  #       cores/<version>.tar.gz; the target format is linux-x86_64)
  #   2. Read the new version from `moon version` and bump this constant
  #   3. Run the full gate locally, all green: regression/golden/dataset/chaos/realdata
  #   4. Commit and push in the same change, then watch CI (a latest drift broke
  #      this repo once: v0.10.12 renamed strconv.from_str)
  MOONBIT_VERSION: 0.1.20261016

jobs:
  test:
    # The macOS leg graduated from its probe on 2026-09-25: darwin-aarch64 went
    # green on every gate with no divergence from Linux. fail-fast is off so one
    # failing leg cannot hide the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore MoonBit toolchain (pinned by MOONBIT_VERSION)
        id: moon-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          # The key carries the platform: linux and macos toolchain binaries are
          # incompatible, so one leg's cache must never satisfy the other
          key: moonbit-${{ matrix.os }}-${{ env.MOONBIT_VERSION }}

      - name: Install MoonBit (cache miss only)
        if: steps.moon-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # latest drifts: fail immediately when the installed/cached toolchain does
      # not match the pin, so the upgrade has to be explicit
      - name: Verify pinned toolchain version
        run: |
          moon version --all
          moon version | grep -F "${{ env.MOONBIT_VERSION }}"

      # moon update only refreshes the registry index: since 0.1.20261016 plain
      # `moon install` is the global binary installer and requires a SOURCE
      # argument (it used to install the module's dependencies), so dependency
      # resolution now happens implicitly during check/build (cold ~/.moon
      # cache: "Downloading moonbitlang/..." during the Lint step)
      - name: Refresh the registry index
        run: moon update

      - name: Lint (check --deny-warn)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      # pkg.generated.mbti is version-controlled, so an interface drift (code
      # changed without running moon info) fails here
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Test
        run: moon test

      - name: Release build & smoke test
        run: |
          moon build --release
          _build/native/release/build/cmd/jumbit/jumbit.exe help > /dev/null

      # The real binary end to end: add/query/remove/import/init (shells missing
      # from the matrix are skipped automatically)
      - name: End-to-end smoke (scripts/smoke.sh)
        run: bash scripts/smoke.sh

      # The extension surface is frozen as goldens (out/err/code triples, byte for
      # byte). Upstream offers no judge here, so the hand-verified golden is the
      # judge; the runner ships python3 and the release binary is already built
      - name: Golden check (scripts/golden_check.sh)
        run: bash scripts/golden_check.sh

      # The MCP protocol surface is frozen: a fixed stdio message sequence compared
      # byte for byte (envelope / tool directory / error codes) — byte-level
      # determinism at the protocol layer is not eyeballed
      - name: MCP protocol check (scripts/mcp_check.sh)
        run: bash scripts/mcp_check.sh
