name: Release

# Triggered by a tag (v*): build the release on three platforms, zip the result,
# and gather it into a draft GitHub Release. It stays a draft because confirming a
# release (editing the changelog wording, marking it latest) is the maintainer's
# explicit act — the workflow produces the artefacts and the draft, never publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MOONBIT_VERSION: 0.1.20261012

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ matrix.os }}-${{ env.MOONBIT_VERSION }}
      # The install dance matches ci.yml (unix) and windows-probe.yml (powershell)
      # word for word: a pinned URL built from unix.sh's version argument returns
      # 403 from the CDN in practice, so both existing workflows install latest and
      # then verify the pin (mismatch = red, forcing an explicit upgrade). Same here
      - name: Install MoonBit (unix)
        if: matrix.os != 'windows-latest'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Install MoonBit (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
      - name: Add MoonBit to PATH
        if: matrix.os != 'windows-latest'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Add MoonBit to PATH (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.moon\bin"
      - name: Verify pinned toolchain version
        shell: bash
        run: |
          moon version --all
          moon version | grep -F "$MOONBIT_VERSION"
      - name: Fetch dependencies
        run: |
          moon update
          moon install
      - name: Build (release)
        run: moon build --release
      - name: Smoke (built binary end-to-end)
        shell: bash
        run: bash scripts/smoke.sh
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="jumbit-${version}-${{ matrix.target }}"
          mkdir -p dist
          # Keep only the archives: bare files once rode along with dist and
          # produced duplicate assets — verified and cleaned up
          if [ "${{ matrix.os }}" = windows-latest ]; then
            cp _build/native/release/build/cmd/jumbit/jumbit.exe "${name}.exe"
            7z a -tzip "dist/${name}.zip" "${name}.exe"
            rm "${name}.exe"
          else
            cp _build/native/release/build/cmd/jumbit/jumbit.exe "${name}"
            tar czf "dist/${name}.tar.gz" "${name}"
            rm "${name}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jumbit-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # install.sh ships as an asset (it is what the README's one-liner fetches).
      # Add it once, in the release job: each of the three build-matrix artefacts
      # carrying its own copy would collide on the same name
      - name: Attach install script
        run: cp scripts/install.sh dist/install.sh
      # Release notes = the matching CHANGELOG section (single source of truth with
      # the repo docs, instead of --generate-notes' PR list)
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "CHANGELOG has no section for $version" >&2; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "jumbit ${{ github.ref_name }}" \
            --notes-file release-notes.md
