name: Release

# tag（v*）触发：三平台 release 构建 → 压缩包 → 汇总为 draft GitHub Release。
# draft 形态：发布确认（改 changelog 文案/置 latest）是维护者显式动作，
# workflow 只负责产物与草稿，不直接 publish。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MOONBIT_VERSION: 0.1.20260920

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moonbit-${{ matrix.os }}-${{ env.MOONBIT_VERSION }}
      # 安装姿势与 ci.yml（unix）/windows-probe.yml（powershell）逐字同款：
      # unix.sh 的版本位置参数拼出的钉版 URL 实测 CDN 403，两份既有 workflow
      # 均装 latest + verify 钉版（不符即红，逼出显式升级），release 同口径
      - name: Install MoonBit (unix)
        if: matrix.os != 'windows-latest'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Install MoonBit (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
      - name: Add MoonBit to PATH
        if: matrix.os != 'windows-latest'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Add MoonBit to PATH (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.moon\bin"
      - name: Verify pinned toolchain version
        shell: bash
        run: |
          moon version --all
          moon version | grep -F "$MOONBIT_VERSION"
      - name: Fetch dependencies
        run: |
          moon update
          moon install
      - name: Build (release)
        run: moon build --release
      - name: Smoke (built binary end-to-end)
        shell: bash
        run: bash scripts/smoke.sh
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="jumbit-${version}-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            cp _build/native/release/build/cmd/main/main.exe "dist/${name}.exe"
            (cd dist && 7z a -tzip "${name}.zip" "${name}.exe")
          else
            cp _build/native/release/build/cmd/main/main.exe "dist/${name}"
            (cd dist && tar czf "${name}.tar.gz" "${name}")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jumbit-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # Release notes = CHANGELOG 对应版本节（与仓库文档单一事实源对齐，
      # 不用 --generate-notes 的 PR 列表）
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "CHANGELOG 缺 $version 节" >&2; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "jumbit ${{ github.ref_name }}" \
            --notes-file release-notes.md
