# The probe side of the roadmap item "no Windows promise; revisit once the probe
# signals are complete". Its purpose differs from the macOS probe: it is EXPECTED
# to be red. It gathers the full signal set in one shot to answer "what would
# Windows really cost to take on":
#   1. toolchain: does moonbit-windows-x86_64.zip install and run (install/powershell.ps1)
#   2. dependencies and build: moon update/install, check, test, release artefacts
#   3. script gates: how far the smoke/golden POSIX assumptions go under Git Bash
# Only an all-green run is worth folding into the matrix; each red step goes into
# the ledger as evidence for or against taking Windows on.
# Triggered by workflow_dispatch only (expected red, so it adds no noise to push
# CI); continue-on-error keeps a single step's failure from truncating the rest of
# the signal, a final Verdict step aggregates, and any failure turns the run red
# (an honest red/green reading).
name: Windows Probe

on:
  workflow_dispatch:

env:
  # Same authoritative version as ci.yml; the upgrade SOP is in ci.yml's env comment
  MOONBIT_VERSION: 0.1.20261016

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install MoonBit (official powershell.ps1)
        run: irm https://cli.moonbitlang.com/install/powershell.ps1 | iex

      - name: Add MoonBit to PATH
        run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.moon\bin"

      # latest drifts: fail immediately when it does not match the pin (same rule as
      # ci.yml, and this step is mandatory)
      - name: Verify pinned toolchain version
        run: |
          moon version --all
          moon version | Select-String -SimpleMatch $env:MOONBIT_VERSION

      - name: Fetch dependencies
        id: deps
        continue-on-error: true
        run: |
          moon update
          moon install

      - name: Lint (check --deny-warn)
        id: check
        continue-on-error: true
        run: moon check --deny-warn

      - name: Test
        id: test
        continue-on-error: true
        run: moon test

      - name: Release build & help
        id: build
        continue-on-error: true
        run: |
          moon build --release
          _build/native/release/build/cmd/jumbit/jumbit.exe help > $null

      # Bottom out the POSIX assumptions under Git Bash: mktemp / PATH / bare-name
      # invocation / hook chain
      - name: End-to-end smoke (scripts/smoke.sh, Git Bash)
        id: smoke
        continue-on-error: true
        shell: bash
        run: bash scripts/smoke.sh

      - name: Golden check (scripts/golden_check.sh, Git Bash)
        id: golden
        continue-on-error: true
        shell: bash
        run: bash scripts/golden_check.sh

      - name: Verdict
        if: always()
        run: |
          $results = [ordered]@{
            deps   = "${{ steps.deps.outcome }}"
            check  = "${{ steps.check.outcome }}"
            test   = "${{ steps.test.outcome }}"
            build  = "${{ steps.build.outcome }}"
            smoke  = "${{ steps.smoke.outcome }}"
            golden = "${{ steps.golden.outcome }}"
          }
          $results.GetEnumerator() | ForEach-Object { "{0,-8} {1}" -f $_.Key, $_.Value }
          if ($results.Values -contains "failure") { exit 1 }
