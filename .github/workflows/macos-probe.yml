# macOS probe：先于 CI matrix 的单档验证（roadmap「macOS CI probe」项）。
# 步骤与 ci.yml test job 逐一对齐（check/fmt/info/test/build/smoke/golden/mcp），
# probe 全绿 = 具备并入 ci.yml matrix 的条件，届时摘 README 的 platform-Linux
# 徽章并更新 USAGE「仅支持 Linux」差异条目，本文件退役删除。
name: macOS Probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 与 ci.yml 同一权威版本，升级 SOP 见 ci.yml env 块注释
  MOONBIT_VERSION: 0.1.20260920

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore MoonBit toolchain (pinned by MOONBIT_VERSION)
        id: moon-cache
        uses: actions/cache@v6
        with:
          path: ~/.moon
          # key 带平台段：darwin-aarch64 工具链与 Linux 档缓存互不命中
          key: moonbit-macos-${{ env.MOONBIT_VERSION }}

      - name: Install MoonBit (cache miss only)
        if: steps.moon-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # latest 会漂移：与钉住版本不符时立即失败（与 ci.yml 同一口径）
      - name: Verify pinned toolchain version
        run: |
          moon version --all
          moon version | grep -F "${{ env.MOONBIT_VERSION }}"

      - name: Fetch dependencies
        run: |
          moon update
          moon install

      - name: Lint (check --deny-warn)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      # 平台分歧探测器之一：darwin 侧 .mbti 若与 Linux 冻结面不同立即挂
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Test
        run: moon test

      - name: Release build
        run: |
          moon build --release
          _build/native/release/build/cmd/main/main.exe help > /dev/null

      - name: End-to-end smoke (scripts/smoke.sh)
        run: bash scripts/smoke.sh

      # 平台分歧探测器之二：golden 三元组逐字节冻结，darwin 输出若有平台
      # 特征（路径形态/errno 文案等）在此暴露
      - name: Golden check (scripts/golden_check.sh)
        run: bash scripts/golden_check.sh

      - name: MCP protocol check (scripts/mcp_check.sh)
        run: bash scripts/mcp_check.sh
